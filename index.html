<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Logístico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #f0f2f5; }
    .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .kpi-value { font-size: 2rem; font-weight: bold; color: #0d6efd; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .badge-completado { background-color: #198754; }
    .badge-enruta     { background-color: #fd7e14; }
    .badge-incidencia { background-color: #dc3545; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <span class="navbar-brand fw-bold">🚛 Dashboard Logístico</span>
    <span class="text-white-50 small" id="fecha-hoy"></span>
  </nav>

  <div class="container-fluid px-4">

    <!-- LOADING -->
    <div id="loading" class="loading">
      <div class="spinner-border text-primary mb-2"></div>
      <p>Cargando datos desde Google Sheets...</p>
    </div>

    <!-- CONTENIDO PRINCIPAL (oculto hasta cargar) -->
    <div id="contenido" style="display:none">

      <!-- KPIs -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="text-muted small">Total Viajes</div>
            <div class="kpi-value" id="kpi-total">—</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="text-muted small">Completados</div>
            <div class="kpi-value" style="color:#198754" id="kpi-ok">—</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="text-muted small">Km Totales</div>
            <div class="kpi-value" style="color:#fd7e14" id="kpi-km">—</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card p-3 text-center">
            <div class="text-muted small">% Nivel de Servicio</div>
            <div class="kpi-value" style="color:#dc3545" id="kpi-ns">—</div>
          </div>
        </div>
      </div>

      <!-- GRAFICA + TABLA -->
      <div class="row g-3">

        <!-- Grafica -->
        <div class="col-md-5">
          <div class="card p-3 h-100">
            <h6 class="fw-bold mb-3">📊 Viajes por Status</h6>
            <canvas id="graficaStatus"></canvas>
          </div>
        </div>

        <!-- Tabla -->
        <div class="col-md-7">
          <div class="card p-3">
            <h6 class="fw-bold mb-3">📋 Registro de Viajes</h6>
            <table class="table table-striped table-sm align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Folio</th>
                  <th>Unidad</th>
                  <th>Ruta</th>
                  <th>Km</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tabla-viajes"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ── CONFIGURACIÓN ──────────────────────────────────────────────
    const SHEET_ID = "1VvB7nOy9FybTTQRC4u3mVmYCgMJSMyxhR5FAg-B0nXs";
    const GID      = 0;
    const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    // ── FECHA EN NAVBAR ────────────────────────────────────────────
    document.getElementById('fecha-hoy').textContent =
      new Date().toLocaleDateString('es-MX', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    // ── PARSEADOR CSV SIMPLE ───────────────────────────────────────
    function parseCSV(text) {
      const linea = text.trim().split('\n')[0];
      const delim = (linea.match(/;/g) || []).length > (linea.match(/,/g) || []).length ? ';' : ',';
      const filas = []; let campo = '', fila = [], dentro = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { dentro = !dentro; continue; }
        if (!dentro && c === delim) { fila.push(campo.trim()); campo = ''; continue; }
        if (!dentro && (c === '\n' || c === '\r')) {
          if (campo !== '') { fila.push(campo.trim()); campo = ''; }
          if (fila.length) filas.push(fila); fila = [];
          continue;
        }
        campo += c;
      }
      if (campo !== '' || fila.length) { fila.push(campo.trim()); filas.push(fila); }
      return filas;
    }

    // ── FUNCION BADGE SEGUN STATUS ─────────────────────────────────
    function badge(status) {
      const s = status.toLowerCase();
      if (s.includes('complet')) return `<span class="badge badge-completado">${status}</span>`;
      if (s.includes('incid'))   return `<span class="badge badge-incidencia">${status}</span>`;
      return `<span class="badge badge-enruta">${status}</span>`;
    }

    // ── CARGAR DATOS ───────────────────────────────────────────────
    async function cargarDatos() {
      try {
        const res  = await fetch(CSV_URL);
        const text = await res.text();
        const filas = parseCSV(text);

        // Separar encabezados y datos
        const headers = filas[0].map(h => h.toUpperCase().trim());
        const data    = filas.slice(1).filter(f => f.length >= 4);

        // Índices de columnas
        const iFolio   = headers.indexOf('FOLIO');
        const iUnidad  = headers.indexOf('UNIDAD');
        const iRuta    = headers.indexOf('RUTA');
        const iKm      = headers.indexOf('KM');
        const iStatus  = headers.indexOf('STATUS');

        // ── LLENAR TABLA ───────────────────────────────────────────
        const tbody = document.getElementById('tabla-viajes');
        tbody.innerHTML = data.map(f => `
          <tr>
            <td>${f[iFolio] ?? '—'}</td>
            <td>${f[iUnidad] ?? '—'}</td>
            <td>${f[iRuta]   ?? '—'}</td>
            <td>${f[iKm]     ?? '—'}</td>
            <td>${badge(f[iStatus] ?? 'N/D')}</td>
          </tr>`).join('');

        // ── CALCULAR KPIs ──────────────────────────────────────────
        const total       = data.length;
        const completados = data.filter(f => (f[iStatus]||'').toLowerCase().includes('complet')).length;
        const kmTotales   = data.reduce((acc, f) => acc + (parseFloat(f[iKm]) || 0), 0);
        const ns          = total > 0 ? Math.round((completados / total) * 100) : 0;

        document.getElementById('kpi-total').textContent = total;
        document.getElementById('kpi-ok').textContent    = completados;
        document.getElementById('kpi-km').textContent    = kmTotales.toLocaleString('es-MX');
        document.getElementById('kpi-ns').textContent    = ns + '%';

        // ── GRAFICA DONUT POR STATUS ───────────────────────────────
        const conteo = {};
        data.forEach(f => {
          const s = f[iStatus] || 'Sin dato';
          conteo[s] = (conteo[s] || 0) + 1;
        });

        new Chart(document.getElementById('graficaStatus'), {
          type: 'doughnut',
          data: {
            labels: Object.keys(conteo),
            datasets: [{
              data: Object.values(conteo),
              backgroundColor: ['#198754','#fd7e14','#dc3545','#0d6efd'],
              borderWidth: 2, borderColor: '#fff'
            }]
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });

        // Mostrar contenido, ocultar loading
        document.getElementById('loading').style.display  = 'none';
        document.getElementById('contenido').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<div class="alert alert-danger mt-4">⚠️ Error al cargar datos.<br><small>${err.message}</small></div>`;
      }
    }

    cargarDatos();
  </script>
</body>
</html>
